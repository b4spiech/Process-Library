services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bpr
      POSTGRES_PASSWORD: bpr
      POSTGRES_DB: bpr
    ports:
      - "5432:5432"
    volumes:
      - bpr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpr -d bpr"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://bpr:bpr@db:5432/bpr
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  bpr_pgdata:
